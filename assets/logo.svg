<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    
    <!-- Metallic Titanium Gradient (Dark on White) -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Warm Amber Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Glowing Electric Amber Orb Filter -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="48" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="2" y="2" rx="46" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Monogram & Tech Device Sculptural Group -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Smartphone Bezel Outline in Brushed Dark Titanium -->
    <rect x="180" y="70" width="140" height="230" rx="24" fill="none" stroke="url(#titaniumGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Phone Dynamic Speaker / Camera Bar -->
    <line x1="225" y1="84" x2="275" y2="84" stroke="url(#titaniumGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Phone Home Indicator Bar -->
    <line x1="220" y1="284" x2="280" y2="284" stroke="url(#titaniumGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Stylized Monogram "M" Outer Titanium Wing -->
    <path d="M 150 250 L 150 110 L 250 220 L 305 160" fill="none" stroke="url(#titaniumGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stylized Monogram "M" Inner Gold Core -->
    <path d="M 175 250 L 175 160 L 250 240 L 325 160 L 325 250" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Radiant Electric Amber Sphere Accent -->
    <circle cx="315" cy="140" r="16" fill="url(#orbGlow)" filter="url(#glowEffect)" />
    <circle cx="315" cy="140" r="8" fill="#fffbeb" />
  </g>

  <!-- Typographic Brand Signature -->
  <g text-anchor="middle">
    <!-- "MAHADEV" -->
    <text x="250" y="380" font-family="'Outfit', sans-serif" font-size="42" font-weight="800" letter-spacing="8" fill="#0f172a">
      MAHADEV
    </text>
    
    <!-- "MOBILES" -->
    <text x="250" y="420" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" letter-spacing="14" fill="url(#goldGrad)">
      MOBILES
    </text>
    
    <!-- Flagship Sub-label -->
    <text x="250" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#64748b">
      FLAGSHIP STORE • VAPI, GUJARAT
    </text>
  </g>
</svg>
